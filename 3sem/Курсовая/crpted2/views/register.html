<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Crpted</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Подключение Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .password-container {
            position: relative;
            margin-bottom: 15px;
        }
        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            cursor: pointer;
        }
        .error-message {
            color: red;
            font-size: 12px;
            margin-top: 5px;
            height: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Присоединяйтесь к нам!</h1>
        <form action="/register" method="POST" onsubmit="return validateForm()">
            <h2>Регистрация</h2>

            <!-- Поле для имени пользователя -->
            <div style="position: relative; margin-bottom: 15px;">
                <input type="text" name="username" id="username" placeholder="Имя пользователя" required>
                <i class="fas fa-user" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                <div id="usernameError" class="error-message"></div>
            </div>

            <!-- Поле для пароля -->
            <div class="password-container">
                <input type="password" name="password" id="password" placeholder="Пароль" required>
                <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                <div id="passwordError" class="error-message"></div>
            </div>

            <!-- Поле для подтверждения пароля -->
            <div class="password-container">
                <input type="password" id="confirmPassword" placeholder="Повторите пароль" required>
                <i class="fas fa-eye password-toggle" id="toggleConfirmPassword"></i>
                <div id="confirmPasswordError" class="error-message"></div>
            </div>

            <button type="submit" class="btn">Зарегистрироваться</button>
            <p>Уже есть аккаунт? <a href="/">Войти</a></p>
        </form>
    </div>

    <script>
        function validateForm() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            let isValid = true;

            // Проверка логина (от 3 до 14 символов)
            if (username.length < 3 || username.length > 14) {
                document.getElementById('usernameError').textContent = 'Логин должен быть от 3 до 14 символов';
                isValid = false;
            } else {
                document.getElementById('usernameError').textContent = '';
            }

            // Проверка пароля (минимум 6 символов)
            if (password.length < 6) {
                document.getElementById('passwordError').textContent = 'Пароль должен содержать минимум 6 символов';
                isValid = false;
            } else {
                document.getElementById('passwordError').textContent = '';
            }

            // Проверка совпадения паролей
            if (password !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
                isValid = false;
            } else {
                document.getElementById('confirmPasswordError').textContent = '';
            }

            return isValid;
        }

        // Функция для переключения видимости пароля
        function setupPasswordToggle(inputId, toggleId) {
            const passwordInput = document.getElementById(inputId);
            const toggleButton = document.getElementById(toggleId);
            
            toggleButton.addEventListener('click', function() {
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                toggleButton.classList.toggle('fa-eye');
                toggleButton.classList.toggle('fa-eye-slash');
            });
        }

        // Инициализация переключателей пароля
        setupPasswordToggle('password', 'togglePassword');
        setupPasswordToggle('confirmPassword', 'toggleConfirmPassword');

        // Валидация при вводе
        document.getElementById('username').addEventListener('input', function() {
            if (this.value.length < 3 || this.value.length > 14) {
                document.getElementById('usernameError').textContent = 'Логин должен быть от 3 до 14 символов';
            } else {
                document.getElementById('usernameError').textContent = '';
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            if (this.value.length < 6) {
                document.getElementById('passwordError').textContent = 'Пароль должен содержать минимум 6 символов';
            } else {
                document.getElementById('passwordError').textContent = '';
            }
            
            // Проверка совпадения паролей при изменении основного пароля
            const confirmPassword = document.getElementById('confirmPassword').value;
            if (confirmPassword && this.value !== confirmPassword) {
                document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
            } else {
                document.getElementById('confirmPasswordError').textContent = '';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            if (this.value !== password) {
                document.getElementById('confirmPasswordError').textContent = 'Пароли не совпадают';
            } else {
                document.getElementById('confirmPasswordError').textContent = '';
            }
        });
    </script>
</body>
</html>
