server {
    listen 80;
    server_name 10.211.55.7; 
    return 301 https://$host$request_uri;  # Редирект HTTP → HTTPS

    # Security headers для HTTP
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

server {
    listen 443 ssl;
    server_name 10.211.55.7;

    # Пути к сертификатам
    ssl_certificate ../../ssl/nginx.crt;
    ssl_certificate_key ../../ssl/nginx.key;

    # Протоколы и шифры
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 24h;

    # Security headers
    # Принудительно включает HTTPS для всех подключений к сайту
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Защита от XSS, инъекций и загрузки вредоносного кода с внешних источников
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;
    # Предотвращает атаки через подмену типа содержимого
    add_header X-Content-Type-Options "nosniff" always;
    # Защита от clickjacking — когда злоумышленник встраивает ваш сайт в свой
    add_header X-Frame-Options "DENY" always;
    # Включает встроенную защиту браузера от XSS-атак.
    add_header X-XSS-Protection "1; mode=block" always;
    # Защита конфиденциальности пользователе
    add_header Referrer-Policy "no-referrer" always;

    # Корневая директория
    root /usr/share/nginx/html;
    index index.html;

    # Запрет доступа к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Оптимизация статики
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Ограничение методов HTTP
    if ($request_method !~ ^(GET|POST|HEAD)$) {
        return 405;
    }
}