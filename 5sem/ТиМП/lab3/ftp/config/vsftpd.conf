listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
xferlog_enable=YES
connect_from_port_20=YES
xferlog_std_format=YES
chroot_local_user=YES
secure_chroot_dir=/etc/vsftpd/seccd
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_address=10.241.127.203
user_sub_token=$USER
local_root=/home/vsftpd/$USER
user_config_dir=/etc/vsftpd/vsftpd_user_conf
allow_writeable_chroot=YES