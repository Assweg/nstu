# docker-compose.yml

services:
  dubbing-studio-db:
    build: .
    container_name: dubbing_studio_postgres
    environment:
      POSTGRES_DB: dubbing_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password_123
      PGDATA: /var/lib/postgresql/data
      # Настройки pgaudit
      POSTGRES_INITDB_ARGS: "--auth-host=md5 --data-checksums"
      # Принудительная инициализация
      POSTGRES_INITDB_WALDIR: /var/lib/postgresql/wal
    command: >
      postgres
      -c log_destination=stderr
      -c logging_collector=on
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql-%Y-%m-%d_%H%M%S.log
      -c log_statement=all
      -c log_min_duration_statement=0
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='/usr/local/bin/s2_lr4_archive_wal.sh %f %p'
      -c archive_timeout=60
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_logs:/var/log/postgresql
      - postgres_archive:/var/lib/postgresql/archive
      - postgres_backup:/var/lib/postgresql/backup
      - postgres_pitr:/var/lib/postgresql/pitr
      # Ключи шифрования ЛР3/ЛР4 — вне БД, только read-only (см. secrets.example/)
      - ./secrets:/var/lib/postgresql/secrets:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dubbing_studio"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dubbing_studio_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@dubbing.studio
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - dubbing-studio-db
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_logs:
  postgres_archive:
  postgres_backup:
  postgres_pitr:
  pgadmin_data: