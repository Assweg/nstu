<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

        <div class="header-container">
            <h1><a href="/home">Crpted</a></h1>

                <a href="/tests"><i class="fas fa-tasks"></i> Тесты</a>

    </main>
